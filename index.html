<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#D4AF37" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Elite Rishta" />
    <meta name="description" content="Elite Matchmaker Empire — luxury rishta matchmaking across the world." />
    <title>Elite Matchmaker Empire</title>
    <meta property="og:image" content="/icon-512.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="/icon-512.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        });
      }
    </script>
    <script>
      setInterval(() => {
        document.querySelectorAll('[data-bolt-badge], div[style*="bottom"], a[href*="bolt"]').forEach(el => {
          if (el.innerText && el.innerText.includes('Made in Bolt')) el.remove();
        });
        if (document.body.innerHTML.includes('Made in Bolt')) {
          document.querySelectorAll('div').forEach(d => {
            if (d.textContent === 'Made in Bolt' || (d.textContent && d.textContent.includes('Made in Bolt'))) {
              const c = d.closest('div');
              if (c) c.remove();
            }
          });
        }
      }, 500);
    </script>
  </body>
</html>
